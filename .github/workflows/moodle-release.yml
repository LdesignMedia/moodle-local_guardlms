name: Release to Moodle Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.10.0'
        required: true
        type: string
      release_notes:
        description: 'Optional release notes; otherwise use the GitHub Release body'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: moodle-marketplace-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tested release from main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out the release validator from main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/main
          path: release-tools
          persist-credentials: false
      - name: Check out the candidate release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          path: plugin
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, version and successful main CI
        id: release
        working-directory: plugin
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: python3 "$GITHUB_WORKSPACE/release-tools/scripts/check_marketplace_release.py"

  submit:
    name: Submit version to Moodle Marketplace
    needs: validate
    permissions:
      contents: read
    # Official Marketplace workflow, pinned to its 2026-10-17 revision.
    uses: moodlehq/moodle-plugin-release/.github/workflows/moodle-release.yml@7c56bd9ce7b0a3125459924e7bd08570d41b9aa3
    with:
      tag: ${{ needs.validate.outputs.tag }}
      release_notes: ${{ github.event.release.body || inputs.release_notes }}
    secrets:
      MOODLE_MARKETPLACE_TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}
