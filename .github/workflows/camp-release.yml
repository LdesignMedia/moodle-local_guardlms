name: Publish release to CAMP

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  camp:
    uses: camp-registry/camp-workflows/.github/workflows/release.yml@v1
    with:
      # version.php declares the minimum only. Keep this range aligned with
      # the documented compatibility and the highest Moodle branch in CI.
      supported-moodle: "3.9,3.10,3.11,4.0,4.1,4.2,4.3,4.4,4.5,5.0,5.1,5.2,5.3"
