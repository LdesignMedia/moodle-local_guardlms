name: ci

on: [push, pull_request]

jobs:
  release-checks:
    name: Marketplace release checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test release validation without publishing
        run: python3 -B -m unittest discover -s scripts -p 'test_marketplace_release.py' -v

  ci:
    uses: catalyst/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    with:
      disable_behat: false
      min_php: '7.4'
      # The shared 5.3 jobs currently require an unavailable snapshot image and
      # use an incompatible MariaDB health check. Keep all older combinations
      # and quality checks here; the source-based moodle53 job covers 5.3 below.
      moodle_branches: 'MOODLE_401_STABLE MOODLE_405_STABLE MOODLE_501_STABLE MOODLE_502_STABLE'

  # Test 5.3 from source independently of the shared workflow's snapshot images.
  moodle53:
    name: Moodle 5.3 / PHP ${{ matrix.php }} / ${{ matrix.database }}
    if: github.event_name == 'pull_request' || github.ref_protected
    runs-on: ubuntu-24.04
    concurrency:
      group: moodle53-${{ github.ref }}-${{ matrix.php }}-${{ matrix.database }}
      cancel-in-progress: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        database: [mariadb, pgsql]
    services:
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11.4' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: utf8mb4
          MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, intl, mbstring, soap, sodium, zip, gd
          ini-values: max_input_vars=5000
          coverage: none
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install Moodle 5.3
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: MOODLE_503_STABLE
      - name: PHP lint
        run: moodle-plugin-ci phplint
      - name: PHPUnit tests
        run: moodle-plugin-ci phpunit --fail-on-warning
      - name: Behat features
        run: moodle-plugin-ci behat --profile chrome
