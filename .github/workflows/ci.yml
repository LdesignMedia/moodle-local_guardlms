name: ci

on: [push, pull_request]

jobs:
  ci:
    uses: catalyst/catalyst-moodle-workflows/.github/workflows/ci.yml@main
    with:
      # Enabled for 1.4.0: the real-time monitoring UX criteria (UX0-UX7) are
      # acceptance criteria covered by tests/behat/sdk_toggle.feature, and a
      # disabled suite would leave them asserted nowhere.
      disable_behat: false
      min_php: 8.1
